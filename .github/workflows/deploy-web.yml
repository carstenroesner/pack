name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Web-Scaffolding erzeugen (nur falls web/ fehlt)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - run: flutter pub get

      - name: Tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -A7 "\[E\]" test.log | head -c 5000 | sed ':a;N;$!ba;s/\n/%0A/g' | fold -w 480 | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code

      - name: Web-Build
        run: flutter build web --release --base-href /point_and_click_adventure/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
