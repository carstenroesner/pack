name: Deploy Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Web-Scaffolding erzeugen (nur falls web/ fehlt)
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - run: flutter pub get

      - name: Tests
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          python3 -c "
          import re
          t=open('test.log').read().replace(chr(13),'')
          lines=[l for l in t.split(chr(10)) if not re.match(r'^\\d\\d:\\d\\d \\+\\d+(:|\\s*$)', l) or '[E]' in l]
          out=chr(10).join(lines)
          for i in range(0, min(len(out), 20000), 3500):
              print('::error::' + out[i:i+3500].replace('%','%25').replace(chr(10),'%0A'))
          "
          exit $code

      - name: Web-Build
        run: flutter build web --release --base-href /point_and_click_adventure/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
